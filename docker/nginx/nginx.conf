# Access log WITHOUT the query string: email-link tokens must never be written to logs.
log_format noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;

    # Docker's DNS. With a variable in proxy_pass, Nginx looks "api" up again
    # (cached 10 s) instead of once at start-up, so recreating the API container no
    # longer leaves the UI on 502 until the frontend is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3001;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;

    access_log /var/log/nginx/access.log noquery;

    # Attachments may be up to 10 MB (checked again by the API); Nginx's default is 1 MB.
    client_max_body_size 11m;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # No URI part: the request path (/api/...) is passed on unchanged.
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }
}
